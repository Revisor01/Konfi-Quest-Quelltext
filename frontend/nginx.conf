server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Verzeichnis-Weiterleitungen (z.B. /docs -> /docs/) relativ ausgeben.
    # Sonst baut nginx eine absolute URL mit "http://" — der Container weiss
    # nichts von TLS, das endet vor Caddy. Der Aufruf funktioniert dann zwar
    # (Caddy leitet auf https zurueck), macht aber einen unnoetigen Umweg
    # ueber eine unverschluesselte Adresse.
    absolute_redirect off;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml application/ld+json;
    gzip_min_length 1024;
    # HTML ist der groesste Textbrocken (Landing-Page ~70 KB) -> unbedingt gzippen
    gzip_comp_level 6;
    gzip_vary on;

    # SICHERHEITS-HEADER
    #
    # ACHTUNG nginx-Verhalten: add_header in einer location ERSETZT die
    # server-Level-Header. Deshalb stehen die Header in jeder location mit
    # eigenem add_header nochmal mit drin (Test sicherheitsHeader.test.ts).
    #
    #   X-Frame-Options / X-Content-Type-Options  wie bisher
    #   Referrer-Policy     fremde Seiten sehen nur die Adresse der Seite, nie
    #                       Pfad und Abfrage (dort stehen Einladungscodes und
    #                       Reset-Tokens: /register?code=, /reset-password?token=)
    #   Permissions-Policy  Kamera (QR-Scanner) und Mikrofon (Sprachaufnahme
    #                       bei Challenges) nur fuer die eigene Seite, Standort,
    #                       Zahlung und USB fuer niemanden
    #   X-XSS-Protection    entfernt: Browser werten ihn nicht mehr aus, alte
    #                       Browser liessen sich ueber ihn zu Fehlverhalten bringen
    set $csp_app "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' data: blob:; connect-src 'self' data: blob: https://konfi-quest.de wss://konfi-quest.de https://t.godsapp.de https://fonts.googleapis.com https://fonts.gstatic.com; worker-src 'self' blob:; frame-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'";
    set $permissions "camera=(self), microphone=(self), geolocation=(), payment=(), usb=()";

    # HTML nie cachen — sonst liefern Browser/Proxy nach einem Deploy die
    # alte index.html/landing.html (etag/last-modified), obwohl der
    # Container laengst den neuen Build hat.

    # Landing Page als Startseite
    location = / {
        try_files /landing.html =404;
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy $permissions always;
    }

    # Datenschutz
    location = /datenschutz {
        try_files /datenschutz.html =404;
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy $permissions always;
    }

    # Impressum
    location = /impressum {
        try_files /impressum.html =404;
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy $permissions always;
    }

    # Kontolöschung
    location = /konto-loeschen {
        try_files /konto-loeschen.html =404;
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy $permissions always;
    }

    # English alias for account deletion (Google Play)
    location = /account-deletion {
        try_files /konto-loeschen.html =404;
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy $permissions always;
    }

    # Dieselben statischen Seiten unter ihrem Dateinamen: wie oben, ohne die
    # CSP der Web-App (sie tragen eigene Inline-Skripte).
    location ~ ^/(landing|datenschutz|impressum|konto-loeschen)\.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy $permissions always;
    }

    # Handbuch und API-Doku: statisch, eigene Inline-Skripte, ohne die CSP der
    # Web-App. Bilder und Skripte darunter fallen in die Asset-Regel unten.
    location /docs/ {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy $permissions always;
    }

    # SEO: robots.txt und sitemap.xml muessen VOR dem SPA-Fallback stehen,
    # sonst liefert try_files die index.html aus und Google bekommt HTML
    # statt der erwarteten Datei.
    location = /robots.txt {
        try_files /robots.txt =404;
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /sitemap.xml {
        try_files /sitemap.xml =404;
        # default_type statt add_header: "Content-Type" per add_header zu
        # setzen funktioniert NICHT — nginx haengt den Header dann doppelt
        # an, weil der Typ aus mime.types bereits gesetzt ist. Der Mimetype
        # muss ueber types/default_type kommen.
        types { } default_type "application/xml; charset=utf-8";
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # iOS Universal Links. Die Datei hat keine
    # Endung, nginx lieferte sie deshalb als application/octet-stream aus.
    # Apple verlangt JSON, ohne Umleitung. Wirkt erst, wenn die App das
    # Entitlement applinks:konfi-quest.de traegt; bis dahin fragt kein iPhone
    # die Datei ab. Inhalt: Team- und Bundle-ID aus dem Xcode-Projekt, Pfade
    # wie bei den Android-App-Links (Test appLinksIos.test.ts).
    location = /.well-known/apple-app-site-association {
        default_type application/json;
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # SPA Fallback - alle anderen Routen zur App (liefert index.html -> no-cache)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy $permissions always;
        add_header Content-Security-Policy $csp_app always;
    }

    # Cache static assets (Vite-Assets sind content-gehasht -> immutable ok)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|avif|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Security headers (Fallback fuer Locations ohne eigene add_header)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy $permissions always;
}
